name: discover-portable-skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  skills-cli-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes skills add . --list
        env:
          DISABLE_TELEMETRY: "1"
      - name: Verify explicit Claude Code and Codex installation
        shell: bash
        run: |
          target="$(mktemp -d)"
          cd "$target"
          npx --yes skills add "$GITHUB_WORKSPACE" --skill '*' -a claude-code -a codex --copy -y
          for skill in system-architecture-harness ai-agent-system-architecture architecture-review-gate; do
            test -f ".claude/skills/$skill/SKILL.md"
            test -f ".agents/skills/$skill/SKILL.md"
          done
        env:
          DISABLE_TELEMETRY: "1"
